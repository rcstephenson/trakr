# Builds trakr and publishes it to GitHub Pages at https://<user>.github.io/<repo>/.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served from /<repo>/, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional cloud sync. One-time setup: after `npx dexie-cloud create`, add the database
          # URL (https://xxxx.dexie.cloud) as a repository VARIABLE named DEXIE_CLOUD_URL
          # (repo Settings -> Secrets and variables -> Actions -> Variables). It is public, not a
          # secret. Unset = the deployed app is local-only.
          VITE_DEXIE_CLOUD_URL: ${{ vars.DEXIE_CLOUD_URL }}
      # GitHub Pages has no SPA rewrites: serve the app for unknown paths (deep links, refreshes).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
